# Builds Scrollwise and runs everything that does not need a person.
#
# This is where the swift-testing suite runs: it needs Xcode's `Testing`
# module, which a Command Line Tools machine does not have. `ScrollwiseTapCheck`
# is deliberately absent — it creates event taps and posts input, which needs an
# Accessibility grant no CI runner can have.
#
# The bundle built here is signed ad hoc (the release certificate never leaves
# the maintainer's keychain), so it proves the universal build, not a release.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # Package.swift requires macOS 26 and Swift 6.2, i.e. Xcode 26.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c release

      - name: Core checks (framework-free)
        run: swift run -c release ScrollwiseVerify

      - name: Swift Testing suite
        run: swift test

      - name: Universal app bundle
        run: |
          bash Scripts/build-app.sh
          lipo -archs build/Scrollwise.app/Contents/MacOS/ScrollwiseApp
